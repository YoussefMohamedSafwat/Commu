name: social_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0-179.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  get_it: ^8.2.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  internet_connection_checker_plus: ^2.9.0
  bloc: ^9.0.1
  animated_toggle_switch: ^0.8.5
  go_router: ^16.2.4
  go_provider: ^1.8.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

